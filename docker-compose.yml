services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ORDER_DB_USER:-order}
      POSTGRES_PASSWORD: ${ORDER_DB_PASS:-orderpass}
      POSTGRES_DB: ${ORDER_DB_NAME:-orderdb}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER:-order} -d ${ORDER_DB_NAME:-orderdb}"]
      interval: 5s
      retries: 5
  notify-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${NOTIFY_DB_USER:-notify}
      POSTGRES_PASSWORD: ${NOTIFY_DB_PASS:-notifypass}
      POSTGRES_DB: ${NOTIFY_DB_NAME:-notifydb}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFY_DB_USER:-notify} -d ${NOTIFY_DB_NAME:-notifydb}"]
      interval: 5s
      retries: 5
  order-service:
    build: ./order-service
    environment:
      DATABASE_URL: postgresql://${ORDER_DB_USER:-order}:${ORDER_DB_PASS:-orderpass}@order-db:5432/${ORDER_DB_NAME:-orderdb}
      BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      order-db:
        condition: service_healthy
  notification-service:
    build: ./notification-service
    environment:
      DATABASE_URL: postgresql://${NOTIFY_DB_USER:-notify}:${NOTIFY_DB_PASS:-notifypass}@notify-db:5432/${NOTIFY_DB_NAME:-notifydb}
      BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      notify-db:
        condition: service_healthy
