name: MaltaShop Prototype CI
on:
  push:
    branches: [ "main" ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile order-service/main.py notification-service/main.py
      - run: docker build -t maltashop/order-service:test ./order-service && docker build -t maltashop/notification-service:test ./notification-service
